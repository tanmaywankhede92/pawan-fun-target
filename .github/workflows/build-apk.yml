name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - "frontend/**"
  pull_request:
    branches: [main, master]
    paths:
      - "frontend/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Generate signing keystore
        run: |
          mkdir -p android/keystore
          keytool -genkeypair -v \
            -keystore android/keystore/funtarget.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias funtarget \
            -storepass funtarget123 \
            -keypass funtarget123 \
            -dname "CN=FunTarget, OU=Dev, O=FunTarget, L=Mumbai, ST=MH, C=IN"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Release APK
        env:
          KEYSTORE_PATH: keystore/funtarget.jks
          KEYSTORE_PASSWORD: funtarget123
          KEY_ALIAS: funtarget
          KEY_PASSWORD: funtarget123
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: fun-target-release-apk
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
